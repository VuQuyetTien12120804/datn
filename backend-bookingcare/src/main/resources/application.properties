spring.application.name=backend-bookingcare
server.port=8085
spring.config.import=optional:classpath:application-local.properties

# SQL Server (clinic_db — chạy db_main.sql rồi db_seed.sql ở thư mục gốc repo)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=clinic_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT (dev only — đổi secret khi deploy)
app.jwt.secret=BookingCare-DATN-Dev-Secret-Key-Min-32-Chars-Long!!
app.jwt.access-expiration-minutes=120
app.jwt.refresh-expiration-days=14

# CORS (web-admin Vite + Android emulator)
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*

# ===== Gmail SMTP (App Password) =====
# Tạo App Password: https://myaccount.google.com/apppasswords
